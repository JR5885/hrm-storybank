<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vicky Chen — CAR Story Bank / Boskalis Offshore Marine Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0B2A3D;
    --steel:#1B4965;
    --deck:#EEF1F3;
    --panel:#FFFFFF;
    --ink:#12262E;
    --mute:#5B6E76;
    --amber:#E8963A;
    --amber-dim:#F6E2C6;
    --line:#D6DCDE;
    --good:#2E7D5B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--deck);
    color:var(--ink);
    font-family:'Inter','Noto Sans TC',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  [lang-zh]{font-family:'Noto Sans TC','Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.display{font-family:'Space Grotesk','Noto Sans TC',sans-serif;}

  /* ===== Top bar ===== */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:14px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--amber);
    position:sticky; top:0; z-index:40;
  }
  .brandmark{display:flex; align-items:center; gap:12px;}
  .brandmark .coord{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--amber-dim);
    letter-spacing:.02em;
  }
  .brandmark .name{font-size:16px; font-weight:600;}
  .langtoggle{
    display:flex;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:999px;
    padding:3px;
  }
  .langtoggle button{
    border:none; background:transparent; color:#cfe0e8;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; font-weight:600;
    padding:6px 16px; border-radius:999px; cursor:pointer;
    transition:background .2s, color .2s;
  }
  .langtoggle button.active{background:var(--amber); color:#241705;}

  /* ===== Hero ===== */
  .hero{
    background:linear-gradient(180deg, var(--navy) 0%, var(--steel) 100%);
    color:#fff;
    padding:44px 28px 32px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:42px 42px;
    pointer-events:none;
  }
  .hero-inner{max-width:1180px; margin:0 auto; position:relative;}
  .hero-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--amber-dim); margin-bottom:12px;
  }
  .hero h1{font-size:30px; font-weight:700; max-width:820px; line-height:1.2;}

  /* ===== Metric banner ===== */
  .metrics{
    max-width:1180px; margin:26px auto 0;
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.18);
    border-radius:4px; overflow:hidden;
  }
  .metric-cell{
    background:rgba(11,42,61,.55);
    padding:18px 16px;
  }
  .metric-cell .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:26px; font-weight:600; color:var(--amber);
  }
  .metric-cell .lbl{font-size:12px; color:#C8D8DF; margin-top:6px;}

  /* ===== Tabs ===== */
  .tabbar-wrap{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky; top:57px; z-index:30;
  }
  .tabbar{
    max-width:1180px; margin:0 auto;
    display:flex; overflow-x:auto;
  }
  .tab{
    flex:1 1 auto; min-width:150px;
    text-align:left;
    background:transparent; border:none; cursor:pointer;
    padding:16px 18px 13px;
    border-bottom:3px solid transparent;
    color:var(--mute);
    display:flex; flex-direction:column; gap:3px;
  }
  .tab .tcode{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--mute);}
  .tab .tname{font-size:13.5px; font-weight:600; color:var(--ink);}
  .tab.active{border-bottom-color:var(--amber); background:var(--deck);}
  .tab.active .tcode{color:var(--amber);}

  /* ===== Content ===== */
  main{max-width:1180px; margin:0 auto; padding:30px 28px 80px;}
  .section-head{margin-bottom:16px;}
  .section-head .tcode{font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:12px;}
  .section-head h2{font-size:22px; margin-top:4px;}

  /* ===== Chart panel (primary visual) ===== */
  .chart-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    margin-bottom:18px;
    padding:22px 26px 18px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:24px;
    align-items:center;
  }
  .chart-panel h4{
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--steel);
    letter-spacing:.02em;
    margin-bottom:14px;
  }
  .chart-body{display:flex; align-items:center; gap:28px; flex-wrap:wrap;}
  .chart-canvas-wrap{position:relative; height:230px; flex:1 1 340px; min-width:260px;}
  .chart-canvas-wrap.doughnut-wrap{flex:0 0 210px; width:210px; height:210px;}
  .chart-stat{
    flex:0 0 auto;
    border-left:1px solid var(--line);
    padding-left:24px;
    text-align:left;
  }
  .chart-stat .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:38px; font-weight:600; color:var(--amber);
    line-height:1;
  }
  .chart-stat .lbl{font-size:12px; color:var(--mute); margin-top:8px; max-width:140px;}
  .doughnut-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .doughnut-center .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:30px; font-weight:600; color:var(--navy);
  }
  .doughnut-center .lbl{font-size:11.5px; color:var(--mute); text-align:center; max-width:130px; margin-top:4px;}

  @media (max-width:860px){
    .chart-panel{grid-template-columns:1fr;}
    .chart-stat{border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:14px;}
  }

  /* ===== Story cards — visual flow ===== */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--steel);
    border-radius:2px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .card-head{
    padding:18px 24px 4px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    flex-wrap:wrap;
  }
  .card-head h3{font-size:16.5px; color:var(--navy);}
  .align-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; color:var(--steel);
    background:var(--deck);
    border:1px solid var(--line);
    padding:5px 9px; border-radius:2px;
    max-width:320px;
  }
  .align-tag .k{color:var(--amber); font-weight:600;}

  .car-flow{display:flex; align-items:flex-start; gap:0; padding:18px 22px 4px; flex-wrap:wrap;}
  .flow-node{flex:1 1 140px; text-align:center; padding:0 6px; min-width:118px;}
  .fn-icon{width:42px; height:42px; margin:0 auto 9px; border-radius:50%; background:var(--deck); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--steel);}
  .fn-icon svg{width:20px; height:20px;}
  .fn-icon.amber{background:var(--amber-dim); color:#9C5A0E; border-color:var(--amber);}
  .fn-icon.result{background:var(--navy); color:#fff; border-color:var(--navy);}
  .fn-text{font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.35;}
  .fn-text.strong{color:var(--navy);}
  .flow-arrow{flex:0 0 auto; color:var(--line); align-self:center; padding-top:10px;}
  .flow-arrow svg{width:18px; height:18px;}
  @media (max-width:700px){
    .car-flow{flex-direction:column; align-items:stretch;}
    .flow-arrow{transform:rotate(90deg); margin:0 auto;}
  }

  .takeaway{
    background:var(--navy); color:#fff;
    padding:12px 24px;
    font-size:13px;
    display:flex; gap:10px; align-items:baseline;
    margin-top:12px;
  }
  .takeaway .icon{flex-shrink:0; color:var(--amber); display:flex; align-items:center;}
  .takeaway .icon svg{width:15px; height:15px;}

  .gantt-panel{
    margin:14px 24px 6px;
    padding:16px 18px 12px;
    background:var(--deck);
    border:1px solid var(--line);
    border-radius:2px;
  }
  .gantt-panel .gtitle{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--steel);
    margin-bottom:2px;
  }
  .gantt-legend{
    display:flex; gap:16px; margin:6px 0 10px;
    font-size:11px; color:var(--mute);
  }
  .gantt-legend span{display:inline-flex; align-items:center; gap:6px;}
  .gantt-legend .dot{width:9px; height:9px; border-radius:2px; display:inline-block;}
  .gantt-canvas-wrap{position:relative; width:100%;}

  .fulltext{margin:14px 24px 16px; border-top:1px dashed var(--line); padding-top:10px;}
  .fulltext summary{cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--steel); list-style:none; display:flex; align-items:center; gap:6px; user-select:none;}
  .fulltext summary::-webkit-details-marker{display:none;}
  .fulltext summary::before{content:"+"; color:var(--amber); font-weight:700; font-size:14px; line-height:1;}
  .fulltext[open] summary::before{content:"\2013";}
  .fulltext[open] summary{margin-bottom:12px;}
  .ft-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding-bottom:6px;}
  .ft-grid .clabel{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--amber); display:block; margin-bottom:6px;}
  .ft-grid p{font-size:12.5px; color:var(--mute);}
  @media (max-width:700px){.ft-grid{grid-template-columns:1fr;}}

  /* ===== Narrative — visual stepper ===== */
  .narrative{
    margin-top:6px;
    background:var(--panel);
    border:1px solid var(--line);
    border-top:3px solid var(--amber);
    border-radius:2px;
    padding:22px 26px 18px;
  }
  .narrative h4{font-size:14px; color:var(--navy); margin-bottom:4px;}
  .narrative .nintro{font-size:12.5px; color:var(--mute); margin-bottom:18px; max-width:680px;}

  .stepper{display:flex; align-items:flex-start; padding:2px 2px 4px;}
  .step-node{display:flex; flex-direction:column; align-items:center; flex:0 0 auto; text-align:center; padding:0 4px;}
  .step-circle{width:32px; height:32px; border-radius:50%; background:var(--navy); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; margin-bottom:8px;}
  .step-title{font-size:11.5px; font-weight:600; color:var(--ink); max-width:108px;}
  .step-line{flex:1 1 auto; height:2px; background:var(--line); margin-top:16px; min-width:16px;}
  @media (max-width:700px){
    .stepper{flex-direction:column; align-items:flex-start;}
    .step-node{flex-direction:row; text-align:left; gap:10px; width:100%;}
    .step-title{max-width:none;}
    .step-line{width:2px; height:14px; margin:0 0 0 15px;}
  }

  .step-details-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:12px 0 2px;}
  .step-details-grid h5{font-size:12px; color:var(--navy); margin-bottom:4px;}
  .step-details-grid p{font-size:11.5px; color:var(--mute);}
  @media (max-width:860px){.step-details-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.step-details-grid{grid-template-columns:1fr;}}

  .narrow{
    margin-top:16px;
    font-size:13px;
    color:var(--ink);
    background:var(--amber-dim);
    border-left:3px solid var(--amber);
    padding:11px 15px;
  }

  footer{
    text-align:center; padding:26px; color:var(--mute); font-size:12px;
    font-family:'IBM Plex Mono',monospace;
  }
</style>
</head>

let ganttInstances = [];
function renderGanttCharts(section){
  if(typeof Chart === 'undefined') return;
  ganttInstances.forEach(c => c.destroy());
  ganttInstances = [];
  const L = DATA[currentLang].labels;
  section.stories.forEach((s, sIdx) => {
    if(!s.gantt) return;
    const canvas = document.getElementById('gantt-' + sIdx);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const navy = '#0B2A3D', steel = '#1B4965', amber = '#E8963A', line = '#D6DCDE', mute = '#5B6E76';
    const rows = s.gantt.rows;
    const inst = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: rows.map(r => r.name),
        datasets: [
          {
            label: L.alignPhase,
            data: rows.map(r => r.align),
            backgroundColor: steel,
            borderRadius: 2,
            barPercentage: 0.55,
            categoryPercentage: 0.7
          },
          {
            label: L.execPhase,
            data: rows.map(r => r.exec),
            backgroundColor: amber,
            borderRadius: 2,
            barPercentage: 0.55,
            categoryPercentage: 0.7
          }
        ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: navy,
          callbacks: {
            label: (c) => ' ' + c.dataset.label + ': W' + c.raw[0] + '–W' + c.raw[1]
          }
        }
      },
      scales: {
        x: {
          min: 0, max: 12,
          ticks: { color: mute, font: { family: 'IBM Plex Mono', size: 10 }, stepSize: 2, callback: (v) => 'W' + v },
          grid: { color: line },
          title: { display: true, text: L.weekAxis, color: mute, font: { family: 'IBM Plex Mono', size: 10 } }
        },
        y: {
          ticks: { color: navy, font: { family: 'Inter', size: 11.5, weight: '500' } },
          grid: { display: false }
        }
      }
    }
  });
  ganttInstances.push(inst);
  });
}

function renderChartJS(section){
  if(typeof Chart === 'undefined'){
    const wrap = document.querySelector('.chart-canvas-wrap');
    if(wrap) wrap.insertAdjacentHTML('beforeend', '<div style="font-size:12px;color:#5B6E76;padding:10px 0;">Chart library failed to load — check network access.</div>');
    return;
  }
  if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
  if(!section.chart) return;
  const canvas = document.getElementById('tabChart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const navy = '#0B2A3D', steel = '#1B4965', amber = '#E8963A', line = '#D6DCDE', mute = '#5B6E76';

  if(section.chart.type === 'bar'){
    const m = section.chart.metrics;
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: m.map(x => x.label),
        datasets: [{
          data: m.map(x => x.value),
          backgroundColor: m.map((_, i) => i % 2 === 0 ? steel : amber),
          borderRadius: 2,
          maxBarThickness: 52
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: navy,
            callbacks: { label: (c) => ' ' + c.parsed.y + '%' }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            ticks: { color: mute, font: { family: 'IBM Plex Mono', size: 11 }, callback: (v) => v + '%' },
          },
          x: {
            ticks: { color: navy, font: { family: 'Inter', size: 12, weight: '500' } },
            grid: { display: false }
          }
        }
      }
    });
  } else if(section.chart.type === 'doughnut'){
    const v = section.chart.metric.value;
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: [section.chart.metric.label, ''],
        datasets: [{
          data: [v, 100 - v],
          backgroundColor: [amber, line],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '72%',
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false }
        }
      }
    });
  }
}
